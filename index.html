<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Egor Grishanov — 3D Profile Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card" tabindex="0" aria-label="Egor Grishanov's profile. Hover or focus to flip the card.">
    <div class="card-front">
      <img src="avatar.svg" alt="Illustrated avatar of a frontend student" width="100" height="100" />
      <h2>Egor Grishanov</h2>
      <p>Frontend student</p>
    </div>

    <div class="card-back">
      <h2>About me</h2>
      <p>I am learning HTML and CSS and building my first web pages. Group 413.1.</p>
      <form action="https://github.com/marselleze" method="get" target="_blank" rel="noopener noreferrer">
        <button type="submit">View GitHub</button>
      </form>
    </div>
  </main>
</body>
</html>
