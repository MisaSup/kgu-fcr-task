
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="card-front">
      <img src="avatar.jpg" alt="Avatar" />
      <h2>John Doe</h2>
      <p>Web Developer</p>
    </div>

    <div class="card-back">
      <p>Web developer creating modern websites.</p>
      <button type="button">Contact Me</button>
    </div>
  </div>
</body>
</html>
