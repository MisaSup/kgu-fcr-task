<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    
    <div class="card-front">
      <img src="https://i.pravatar.cc/150?img=12" alt="Avatar of John Doe" />
      <h2>John Doe</h2>
      <p>Frontend Developer</p>
    </div>

    
    <div class="card-back">
      <p>
        Love CSS, animations, code and Marmok.
      </p>
      <button>Contact Me</button>
    </div>
  </div>
</body>
</html>
